version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Chicago
    open-pull-requests-limit: 10
    groups:
      react-router:
        patterns: ["react-router", "@react-router/*", "@vercel/react-router"]
      testing:
        patterns:
          [
            "vitest",
            "@vitest/*",
            "@testing-library/*",
            "cypress",
            "playwright",
            "@axe-core/*",
            "happy-dom",
            "msw",
          ]
      lint:
        patterns: ["eslint*", "@typescript-eslint/*", "prettier"]
    ignore:
      # Major bumps of the framework are planned work, not drive-by PRs.
      - dependency-name: "react-router"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@react-router/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Chicago
    groups:
      actions:
        patterns: ["*"]
