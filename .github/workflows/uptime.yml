# Scheduled uptime + link check of the LIVE site (read-only GET requests).
# Opens (or comments on) a single tracking issue when it fails, and closes it
# when the site recovers. Schedules only run from the default branch, so this
# has no effect until the file reaches main.
name: Uptime and links

on:
  schedule:
    - cron: "*/30 * * * *" # uptime every 30 min
    - cron: "17 13 * * *" # full link check daily ~08:17 CT
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  SITE: https://ari.soy

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Uptime (status + latency per route)
        id: uptime
        run: |
          set -u
          fail=0
          : > uptime-report.md
          for route in / /work /about /contact /api/scene-state /healthcheck; do
            out=$(curl -sS -o /dev/null -w "%{http_code} %{time_total}" --max-time 20 "$SITE$route" || echo "000 0")
            code=${out%% *}; t=${out##* }
            echo "| $route | $code | ${t}s |" >> uptime-report.md
            case "$code" in 2??|3??) ;; *) fail=1 ;; esac
          done
          cat uptime-report.md
          echo "failed=$fail" >> "$GITHUB_OUTPUT"

      - name: Link check (daily)
        id: links
        if: github.event.schedule == '17 13 * * *' || github.event_name == 'workflow_dispatch'
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-concurrency 4 --timeout 20
            --accept 200..=299,403,429
            --exclude "^mailto:"
            ${{ env.SITE }}/ ${{ env.SITE }}/work ${{ env.SITE }}/about ${{ env.SITE }}/contact
          output: lychee-report.md
          fail: false

      - name: Open, update or close tracking issues
        uses: actions/github-script@v7
        env:
          UPTIME_FAILED: ${{ steps.uptime.outputs.failed }}
          LINKS_RAN: ${{ steps.links.outcome == 'success' }}
          LINKS_EXIT: ${{ steps.links.outputs.exit_code }}
        with:
          script: |
            const fs = require("fs");
            const read = (f) => (fs.existsSync(f) ? fs.readFileSync(f, "utf8") : "");
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const site = process.env.SITE;

            // One tracking issue per kind; a failing run comments on the open
            // one instead of opening duplicates, a passing run closes it.
            async function track(label, failed, title, details) {
              const open = await github.rest.issues.listForRepo({ owner, repo, state: "open", labels: label, per_page: 1 });
              const existing = open.data[0];
              if (failed) {
                const body = `**${title}** for ${site} ([run](${runUrl})).\n\n${details}`;
                if (existing) await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
                else await github.rest.issues.create({ owner, repo, title: `${title}: ${site}`, labels: [label], body });
              } else if (existing) {
                await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body: `Recovered ([run](${runUrl})).` });
                await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: "closed" });
              }
            }

            const uptimeFailed = process.env.UPTIME_FAILED === "1";
            await track("uptime-alert", uptimeFailed, "Uptime check failed",
              "| route | status | time |\n|---|---|---|\n" + read("uptime-report.md"));

            let linksFailed = false;
            if (process.env.LINKS_RAN === "true") {
              linksFailed = process.env.LINKS_EXIT !== "0";
              await track("broken-links", linksFailed, "Broken links found", read("lychee-report.md"));
            }
            if (uptimeFailed || linksFailed) core.setFailed("Site check failed");
