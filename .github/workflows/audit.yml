name: Dependency audit

on:
  pull_request:
    paths: [package.json, package-lock.json]
  push:
    branches: [main, redesign]
    paths: [package.json, package-lock.json]
  schedule:
    - cron: "0 12 * * *" # daily 06:00/07:00 CT
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: npm audit (production deps, high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Audit production dependencies (fails on high/critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Audit all dependencies (report only)
        run: npm audit --audit-level=critical || true
      - name: Verify registry signatures
        run: npm audit signatures

  dependency-review:
    name: Dependency review (PRs)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
